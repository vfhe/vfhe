[project]
name = "vfhe"
version = "0.0.4.dev0"
description = "A library for Zero-Knowledge Proofs, (verifiable) Fully Homomorphic Encryption, and related techniques."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Ignacio Cascudo" },
    { name = "Anamaria Costache" },
    { name = "Daniele Cozzo" },
    { name = "Adrien Dubois" },
    { name = "Dario Fiore" },
    { name = "Antonio Guimarães" },
    { name = "Robin Köstler" },
    { name = "Michał Osadnik" },
    { name = "Alin-Petru Roșu" },
    { name = "Eduardo Soria-Vazquez" },
]
maintainers = [{ name = "The vFHE Maintainers", email = "maintainers@vfhe.ai" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]
dependencies = ["cffi>=2.1.0", "protobuf>=7.35.1,<8", "mpmath>=1.4.1"]

[project.optional-dependencies]
kernels = ["meson>=1.4", "ninja>=1.11"]

[project.urls]
Homepage = "https://github.com/vfhe/vfhe"
Repository = "https://github.com/vfhe/vfhe"
Issues = "https://github.com/vfhe/vfhe/issues"
Changelog = "https://github.com/vfhe/vfhe/blob/main/CHANGELOG.md"
Documentation = "https://vfhe.github.io/vfhe/"

[build-system]
requires = ["meson-python>=0.18", "cffi>=2.1.0", "grpcio-tools>=1.81,<1.85"]
build-backend = "mesonpy"

[dependency-groups]
compile = [
    "setuptools>=80",
    "cffi>=2.1.0",
    "grpcio-tools>=1.81,<1.85",
    "protobuf>=7.35.1,<8",
    "meson>=1.4",
    "meson-python>=0.18",
    "ninja>=1.11",
    "build>=1.2",
]
test = [
    { include-group = "compile" },
    "pytest>=9.1.1",
    "pytest-cov>=7",
    "gcovr>=8.3",
    "mpmath>=1.4.1",
]
docs = [
    { include-group = "compile" },
    "sphinx>=8",
    "breathe>=4.36",
    "furo>=2024.8.6",
    "myst-parser>=4",
    "sphinxcontrib-mermaid>=1",
]
lint = [
    { include-group = "test" },
    "ruff==0.16.10",
    "clang-format==23.1.2",
    "zizmor==1.30.1",
    "pre-commit>=4.3",
    "pyright>=1.1.400",
]
publish = ["twine>=6", "wheel>=0.45"]
release = [{ include-group = "compile" }, { include-group = "publish" }]
smoke = ["tox>=4.21"]
dev = [
    { include-group = "compile" },
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "release" },
    { include-group = "smoke" },
    { include-group = "test" },
]

[tool.cibuildwheel]
skip = "*musllinux* cp3??t-*"

[tool.tox.env.sandbox]
skip_install = true
deps = ["{env:VFHE_DIST}", "meson>=1.4", "ninja>=1.11"]
pass_env = ["VFHE_ENGINE"]
change_dir = "{env_tmp_dir}"
allowlist_externals = ["{tox_root}/tools/test/smoke/run.sh"]
commands = [["{tox_root}/tools/test/smoke/run.sh", "{posargs}"]]

[tool.tox.env.pypi]
base = ["sandbox"]

[tool.tox.env.testpypi]
base = ["sandbox"]
set_env = { PIP_INDEX_URL = "https://test.pypi.org/simple/", PIP_EXTRA_INDEX_URL = "https://pypi.org/simple/" }

[tool.coverage.run]
branch = true
source = ["vfhe"]

[tool.pytest.ini_options]
testpaths = ["modules/*/python/test"]
addopts = "--import-mode=importlib --strict-markers"
markers = ["complete"]
cache_dir = ".cache/pytest"
