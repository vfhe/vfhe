[project]
name = "vfhe"
dynamic = ["version"]
description = "A library for Zero-Knowledge Proofs, (verifiable) Fully Homomorphic Encryption, and related techniques."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Ignacio Cascudo" },
    { name = "Anamaria Costache" },
    { name = "Daniele Cozzo" },
    { name = "Adrien Dubois" },
    { name = "Dario Fiore" },
    { name = "Antonio Guimaraes" },
    { name = "Robin Kostler" },
    { name = "Michal Osadnik" },
    { name = "Alin-Petru Rosu" },
    { name = "Eduardo Soria-Vazquez" },
]
maintainers = [{ name = "The vFHE Maintainers", email = "maintainers@vfhe.ai" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cffi>=2.1.0",
    "protobuf>=7.35.1,<8",
    "mpmath>=1.4.1",
    "setuptools>=66",
]

[project.urls]
Homepage = "https://github.com/vfhe/vfhe"
Repository = "https://github.com/vfhe/vfhe"
Issues = "https://github.com/vfhe/vfhe/issues"
Changelog = "https://github.com/vfhe/vfhe/blob/main/CHANGELOG.md"
Documentation = "https://github.com/vfhe/vfhe/blob/main/docs/USAGE.md"

[build-system]
requires = [
    "meson-python>=0.18",
    "setuptools-scm>=10.2.1",
    "cffi>=2.1.0",
    "grpcio-tools>=1.81,<1.84",
]
build-backend = "mesonpy"

[dependency-groups]
compile = [
    "setuptools>=80",
    "cffi>=2.1.0",
    "grpcio-tools>=1.81,<1.84",
    "protobuf>=7.35.1,<8",
    "meson>=1.4",
    "meson-python>=0.18",
    "ninja>=1.11",
    "setuptools-scm>=10.2.1",
    "build>=1.2",
]
test = [
    { include-group = "compile" },
    "pytest>=9.1.1",
    "pytest-cov>=7",
    "gcovr>=8.3",
    "mpmath>=1.4.1",
]
lint = [
    { include-group = "test" },
    "ruff==0.16.4",
    "clang-format==22.1.8",
    "zizmor==1.29.0",
    "pre-commit>=4.3",
    "pyright>=1.1.400",
]
publish = ["twine>=6", "wheel>=0.45"]
release = [{ include-group = "compile" }, { include-group = "publish" }]
smoke = ["tox>=4.21"]
dev = [
    { include-group = "compile" },
    { include-group = "lint" },
    { include-group = "release" },
    { include-group = "smoke" },
    { include-group = "test" },
]

[tool.cibuildwheel]
skip = "*musllinux* cp3??t-*"

[tool.tox.env.sandbox]
skip_install = true
deps = ["{env:VFHE_DIST}"]
pass_env = ["VFHE_ENGINE"]
change_dir = "{env_tmp_dir}"
allowlist_externals = ["{tox_root}/test/smoke/run.sh"]
commands = [["{tox_root}/test/smoke/run.sh", "{posargs}"]]

[tool.tox.env.pypi]
base = ["sandbox"]

[tool.tox.env.testpypi]
base = ["sandbox"]
set_env = { PIP_INDEX_URL = "https://test.pypi.org/simple/", PIP_EXTRA_INDEX_URL = "https://pypi.org/simple/" }

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportUnusedFunction = "error"
reportUnusedClass = "error"
reportUnusedExpression = "error"
extraPaths = [
    "build",
    "test/smoke/cases",
    "modules/arith/python/src",
    "modules/circuit/python/src",
    "modules/fhe/python/src",
    "modules/mlwe/python/src",
    "modules/piop/python/src",
    "modules/polycom/python/src",
    "modules/util/python/src",
]
exclude = [
    "**/.*",
    "**/__pycache__",
    "build/*.p",
    "dist",
    "external",
]

[tool.ruff]
cache-dir = ".cache/ruff"
extend-exclude = ["external"]

[tool.ruff.lint]
select = [
    "ARG",
    "B",
    "BLE",
    "C4",
    "E4",
    "E7",
    "E9",
    "F",
    "G",
    "I",
    "PERF",
    "PIE",
    "PYI",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "TC",
    "TID",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"modules/*/python/test/*" = ["S101", "SLF001"]
# An implementation's element, field and vector classes share private state
# by design (a vector borrows its field's native parameters).
"modules/arith/python/src/vfhe/arith/impl/**" = ["SLF001"]
# The piop and polycom frameworks arrived with findings this rule set
# reports: assert as an internal invariant (their tests expect
# AssertionError), cooperating classes reaching into one another, and
# unused arguments in protocol implementations. Scoped here rather than
# rewritten, and to be settled by the authors of that code.
"modules/piop/python/**" = ["S101", "S311", "SLF001", "ARG002"]
"modules/polycom/python/**" = ["SLF001", "ARG002", "TC001"]

[tool.coverage.run]
branch = true
source = ["vfhe"]

[tool.pytest.ini_options]
testpaths = ["modules/*/python/test"]
addopts = "--import-mode=importlib --strict-markers"
markers = ["complete"]
cache_dir = ".cache/pytest"
