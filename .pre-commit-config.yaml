default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: check-json

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # Surnames from the literature that codespell reads as typos.
        args: [--ignore-words-list=bootle]
        # Manual only, so a prose typo never blocks a merge: `make spellcheck`.
        stages: [manual]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types_or: [python, pyi]

      - id: notes-test
        name: release notes
        entry: tools/release/notes/test.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: clang-format
        name: clang-format
        entry: clang-format --dry-run --Werror
        language: system
        files: \.(c|h)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        exclude: ^\.github/PULL_REQUEST_TEMPLATE\.md$

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows
      - id: check-dependabot
      - id: check-github-issue-forms
      - id: check-github-issue-config
      - id: check-jsonschema
        name: Validate CycloneDX SBOMs
        files: ^external/.*\.cdx\.json$
        args:
          [
            --schemafile,
            "https://raw.githubusercontent.com/CycloneDX/specification/1.6.1/schema/bom-1.6.schema.json",
          ]
      - id: check-citation-file-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: vendored-sbom
        name: BLAKE3 SBOM fits the submodule
        entry: external/blake3/check_freeze.sh
        language: system
        always_run: true
        pass_filenames: false

  - repo: local
    hooks:
      - id: zizmor
        name: zizmor
        entry: zizmor --no-progress --persona=pedantic
        language: system
        files: ^\.github/(workflows/.*|actions/.*/action)\.ya?ml$

  - repo: local
    hooks:
      - id: dco-signoff
        name: DCO sign-off (git commit -s)
        entry: "Signed-off-by:"
        language: pygrep
        args: [--negate]
        stages: [commit-msg]
