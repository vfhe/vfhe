default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Any file: hygiene, and what must never enter the history.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: check-json

  # Every file states its copyright and licence, by header or by REUSE.toml.
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  # Python and C, by the versions the dev dependency group pins.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: clang-format
        name: clang-format
        entry: clang-format --dry-run --Werror
        language: system
        files: \.(c|h)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint

  # The CI configuration: its schema, then its semantics, then its security.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows
      - id: check-dependabot
      - id: check-github-issue-forms
      - id: check-github-issue-config
      - id: check-citation-file-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: ci-scripts
        name: replay the CI decision scripts against fixtures
        entry: python .github/tests/ci_scripts.py
        language: system
        pass_filenames: false
        always_run: true
      - id: zizmor
        name: zizmor
        entry: zizmor --no-progress --persona=pedantic
        language: system
        files: ^\.github/(workflows/.*|actions/.*/action)\.ya?ml$

  # The commit message, which is a different stage: `git commit -s`.
  - repo: local
    hooks:
      - id: dco-signoff
        name: DCO sign-off (git commit -s)
        entry: "Signed-off-by:"
        language: pygrep
        args: [--negate]
        stages: [commit-msg]
