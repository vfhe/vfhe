default: true
# 80-col prose is convention, kept by review: enforcing it would rewrap the
# vendored Code of Conduct, released changelog sections, and unwrappable URLs.
MD013: false
MD060: false # table pipe spacing: the aligned tables here are the readable form
MD028: false # blank line between blockquotes: GitHub renders them as two, which is the intent
MD024:
  siblings_only: true # Keep a Changelog repeats Added/Changed/Fixed under every version
