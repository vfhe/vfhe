version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # A frozen requirements file records no parent, so a transitive pin can be
    # raised past the ceiling its requirer sets. Drop the entry once the
    # requirer widens its range.
    ignore:
      - dependency-name: chardet # cyclonedx-bom 7.3.1 requires chardet<6.0
        versions: [">=6"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"

  - package-ecosystem: docker
    directory: "/.clusterfuzzlite"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
