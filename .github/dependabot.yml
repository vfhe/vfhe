version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directories:
      - "/"
      - "/.clusterfuzzlite"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Sphinx holds docutils below 0.23.
      - dependency-name: docutils
        versions: [">=0.23"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: docker
    directories:
      - "/.clusterfuzzlite"
      - "/.github"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
