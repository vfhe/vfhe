version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  # No gitsubmodule entry: its updater only moves to the tracked branch's newest
  # commit, so it proposed untagged snapshots. Preferring tags is an upstream
  # request (dependabot-core#1639), so submodules are bumped by hand, to a tag.

  # Both Dockerfiles are in subdirectories; "/" alone would scan nothing.
  - package-ecosystem: docker
    directories:
      - "/.clusterfuzzlite"
      - "/.github"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
