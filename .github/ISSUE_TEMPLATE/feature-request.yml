name: Feature request
description: Propose an addition or change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do that vFHE currently cannot.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How vFHE could support it, if you have a shape in mind.
