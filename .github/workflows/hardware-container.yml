# Publishes the images the self-hosted jobs run in, when their definition changes.
name: Hardware Container

on:
  push:
    branches: [main]
    paths: [.github/hardware.Dockerfile]
  workflow_dispatch:

permissions: {}

concurrency:
  group: hardware-container
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ build ---

  hardware-container:
    name: Hardware Container (${{ matrix.tag }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: hardware, base: "ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea" }
          - { tag: hardware-cuda, base: "nvidia/cuda:12.6.3-devel-ubuntu24.04" }
    permissions:
      contents: read # checkout
      packages: write # push to this repository's registry
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Log in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github
          file: .github/hardware.Dockerfile
          build-args: BASE=${{ matrix.base }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.tag }}:latest

  # ----------------------------------------------------------------- alert ---

  alert:
    name: Alert
    if: failure() && github.event_name != 'workflow_dispatch'
    needs:
      - hardware-container
    uses: ./.github/workflows/alert.yml
    permissions: {}
    secrets:
      zulip-api-key: ${{ secrets.ZULIP_API_KEY }}
