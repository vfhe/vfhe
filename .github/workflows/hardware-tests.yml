# Hardware tests on the self-hosted runner; hosted runners can lack ISA undeterministically.
name: Hardware Tests

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: read # checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # a push is a record, not a race: never cancel one

jobs:
  # ------------------------------------------------------------------ test ---

  hardware-tests:
    name: Hardware (avx512ifma)
    runs-on: [self-hosted, Linux, X64, avx512ifma]
    container:
      image: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
      # ASan's fixed shadow mapping needs the ASLR entropy of a host process.
      options: --privileged
    timeout-minutes: 120
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run C suites natively
        uses: ./.github/actions/test-c
        with:
          engine: avx512ifma
      - name: Run Python suites natively
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test-python
        with:
          engine: avx512ifma
          suites: complete
      - name: Run C suites sanitized
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test-c
        with:
          engine: avx512ifma
          sanitize: address,undefined
      - name: Run Python suites sanitized
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test-python
        with:
          engine: avx512ifma
          sanitize: address,undefined
          suites: fast
      - name: Smoke test an installed package
        if: ${{ !cancelled() }}
        run: make smoke

  # ----------------------------------------------------------------- alert ---

  alert-channel:
    name: Alert Channel
    needs: [hardware-tests]
    if: failure()
    uses: ./.github/workflows/alert-channel.yml
    permissions: {}
    secrets:
      zulip-api-key: ${{ secrets.ZULIP_API_KEY }}
