# SPDX-License-Identifier: Apache-2.0
name: Notify Zulip on failure

on:
  workflow_run:
    workflows:
      - CI
      - Coverage
      - CFLite Batch
      - CodeQL
      - Scorecard
      - Dependency Review
      - Release
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the failure to Zulip
        uses: zulip/github-actions-zulip/send-message@f675f2b4eb2a95fae974215476dcb7ad8dfeff6b # v2.0.2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: "ci-bot@vfhe.zulipchat.com"
          organization-url: "https://vfhe.zulipchat.com"
          type: "stream"
          to: "verifhe-ci"
          topic: "failures"
          content: |
            ❌ [${{ github.event.workflow_run.name }}](${{ github.event.workflow_run.html_url }}) failed on `${{ github.event.workflow_run.head_branch }}`
