#
#   lint ───────────────────────────────────────────────────────────────┐
#   dco ────────────────────────────────────────────────────────────────┤
#   check-simd-build ───────────────────────────────────────────────────┤
#   test-sde ───────────────────────────────────────────────────────────┤
#   test-sde-python ────────────────────────────────────────────────────┼─→ ci-ok
#   test-tuned-arm ─────────────────────────────────────────────────────┤
#   fuzz-changed-code ──────────────────────────────────────────────────┤
#   test-sdist ─────────────────────────────────────────────────────────┤
#   test-c ─→ test-python ──────────────────────────────────────────────┘
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR runs; keep main's, they are the per-commit record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (Python and C)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-vfhe
        with:
          build: proto
      - name: Run ruff (lint and format check)
        run: |
          ruff check modules packaging scripts smoke .clusterfuzzlite .github setup.py
          ruff format --check modules packaging scripts smoke .clusterfuzzlite .github setup.py
      - name: Run pyright
        run: pyright
      - name: Run clang-format
        run: |
          find modules \( -name '*.c' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  # Every PR commit must carry its author's Signed-off-by (the DCO,
  # developercertificate.org); bot commits are exempt. On push there is no
  # commit range to police, so the job passes vacuously (ci-ok counts
  # skipped jobs as failures, so it must not skip).
  dco:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "not a pull request; nothing to check"
            exit 0
          fi
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author=$(git show -s --format='%an <%ae>' "$sha")
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git show -s --format=%B "$sha" | grep -qF "Signed-off-by: $author"; then
              echo "::error::commit ${sha:0:10} lacks 'Signed-off-by: $author'." \
                "Sign with 'git commit -s'; fix the series with" \
                "'git rebase --signoff' and force-push."
              failed=1
            fi
          done
          exit $failed

  # Object-only compile of the AVX-512 / AES-NI kernels; nothing is built or
  # kept, the compile outcome is the check. On macOS this cross-compiles with
  # Apple clang (arm64 runner, -target x86_64): the toolchain an Intel-Mac
  # install would use. Execution is test-sde's job, Linux-only: SDE has no
  # macOS build and cannot run under Rosetta on the arm64 runners.
  check-simd-build:
    name: SIMD compile check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-vfhe
        with:
          build: none
      # --require: fail instead of skip on hosts that cannot target x86.
      - name: Compile-check the SIMD kernels
        run: python scripts/check_simd_build.py --require

  # check-simd-build proves the AVX-512 engine compiles; these two prove it
  # computes, executed under Intel SDE emulating an Ice Lake CPU (the
  # x86-tuned rail of the engine matrix; test-python pins the baseline rail,
  # and a future arm-tuned engine runs natively on the arm runners). The C
  # tier is split out for fast signal; the suites are hierarchical, so
  # "complete" alone covers everything at the cost of wall-clock.
  test-sde:
    name: C tests under Intel SDE (x86 AVX-512)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-vfhe
        with:
          build: none
      # --emulate: some runners have real IFMA; one deterministic path anyway.
      - name: Run the C tests on the tuned engine under SDE
        run: python scripts/run_tuned_tests.py --suite c --emulate

  test-sde-python:
    name: Python tests under Intel SDE (${{ matrix.suite }}, x86 AVX-512)
    runs-on: ubuntu-latest
    # Emulation is 10-50x slower than hardware; the runner hard-limit is 6h.
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        suite: [fast, complete]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-vfhe
        with:
          build: none
      # Yama (ptrace_scope=1) blocks SDE's helper from detaching from the
      # compiler subprocesses the dynamic-extensions test spawns.
      - name: Let SDE manage subprocesses
        run: sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Run the Python suite on the tuned engine under SDE
        env:
          SUITE: ${{ matrix.suite }}
        run: python scripts/run_tuned_tests.py --suite "$SUITE" --emulate

  # Pre-wired for the arm-tuned engine: no arm kernels exist yet, so
  # --if-supported makes these no-ops. The switch is discovery.TUNED_ARCHES —
  # in-repo, so every run of a commit behaves the same (no runner probing).
  # Once it declares arm64, these execute natively: NEON needs no emulator.
  test-tuned-arm:
    name: Tuned tests (${{ matrix.os }}, arm64)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-vfhe
        with:
          build: none
      - name: Run the tuned suites where an arm engine exists
        run: python scripts/run_tuned_tests.py --suite complete --if-supported

  # Fuzzes only the code this change touches (ClusterFuzzLite, own container;
  # needs no setup-vfhe). The long batch runs stay in cflite-batch.yml.
  fuzz-changed-code:
    name: Fuzz the changed code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: read-all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build the fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
      - name: Run the fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 180
          mode: code-change
          output-sarif: true

  # Test the C kernels before the Python wrappers that call them.
  # Compiles its own C: needs no extension build and no Python matrix.
  # ubuntu-24.04-arm: aarch64 Linux; also the future home of any arm-tuned
  # kernels (arch/arm64/), which would run natively here, no emulator.
  test-c:
    name: C tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-vfhe
        with:
          build: none
      - name: Run the C unit tests
        run: python scripts/run_c_tests.py

  # One job for the whole suite: --complete runs the fast subset plus the
  # heavy @complete bootstraps. VFHE_PORTABLE pins the BASELINE engine:
  # without it, a runner that happens to have AVX-512 IFMA would auto-tune
  # and silently test a different engine. The tuned engines have their own
  # deterministic rails: x86 under SDE (test-sde, test-sde-python); a future
  # arm-tuned one runs natively on the arm legs of this matrix.
  test-python:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python }})
    needs: [test-c]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VFHE_PORTABLE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-vfhe
        with:
          python-version: ${{ matrix.python }}
      - name: Run the complete Python tests
        run: pytest -q --complete

  test-sdist:
    name: Sdist build and install from source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-vfhe
        with:
          build: none
      - name: Build the sdist
        run: python -m build --sdist
      # --strict: treat warnings as errors; PyPI rejects them at upload.
      - name: Check the package metadata
        run: twine check --strict dist/*.tar.gz
      # Same checks as `make smoke`: scratch venv install, then smoke/*.py against it.
      # The install compiles every build input, so it also proves the sdist is complete.
      - name: Install the sdist into a clean venv (compiles)
        run: python scripts/check_install.py dist/*.tar.gz
      - name: Run the smoke tests against the install
        run: python scripts/run_smoke_tests.py --python .cache/install/venv/bin/python
      - name: Upload the sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 2 # reproducible on demand; no need to store longer

  # Point branch protection at this job alone; the job list below stays editable.
  ci-ok:
    name: CI OK
    # always(): report when a dependency fails, instead of hanging the required check.
    if: always()
    needs:
      [
        lint,
        dco,
        check-simd-build,
        test-sde,
        test-sde-python,
        test-tuned-arm,
        fuzz-changed-code,
        test-c,
        test-python,
        test-sdist,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Count skipped as failure: jobs after a failure are skipped, not failed.
      - name: Assert every CI job succeeded
        if: >-
          ${{ contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped') }}
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: |
          echo "::error::One or more CI jobs did not succeed: $RESULTS"
          exit 1
