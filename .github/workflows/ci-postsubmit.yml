# Push-to-main checks at complete depth; too slow for the merge gate.
name: CI Postsubmit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # a push is a record, not a race: never cancel one

jobs:
  # ---------------------------------------------------------------- checks ---

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  scan-vulnerability:
    name: Scan Vulnerability
    uses: ./.github/workflows/scan-vulnerability.yml
    permissions:
      actions: read # analyser reads this run's metadata
      contents: read # checkout
      security-events: write # upload code-scanning results

  # ------------------------------------------------------------------ test ---

  test-c:
    name: Test C (${{ matrix.engine }}, ${{ matrix.os }})
    permissions:
      contents: read # checkout
      id-token: write # Codecov upload
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: portable, os: macos-26 }
          - { engine: portable, os: ubuntu-24.04, coverage: "true" }
          - { engine: portable, os: ubuntu-24.04-arm }
          - { engine: avx512ifma, os: ubuntu-24.04, coverage: "true", emulate: "1" }
          - { engine: neon, os: macos-26 }
          - { engine: neon, os: ubuntu-24.04-arm, coverage: "true" }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run C suites
        uses: ./.github/actions/test-c
        with:
          coverage: ${{ matrix.coverage || 'false' }}
          emulate: ${{ matrix.emulate || '0' }}
          engine: ${{ matrix.engine }}

  test-python:
    name: Test Python (${{ matrix.engine }}, ${{ matrix.os }}, py${{ matrix.python }})
    permissions:
      contents: read # checkout
      id-token: write # Codecov upload
    needs: [test-c]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [portable]
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - { os: ubuntu-24.04, python: "3.14" }
        include:
          - { engine: portable, os: ubuntu-24.04, python: "3.14", coverage: "true" }
          - { engine: avx512ifma, os: ubuntu-24.04, python: "3.14", coverage: "true", emulate: "1" }
          - { engine: neon, os: macos-26, python: "3.14" }
          - { engine: neon, os: ubuntu-24.04-arm, python: "3.14", coverage: "true" }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run Python suites
        uses: ./.github/actions/test-python
        with:
          coverage: ${{ matrix.coverage || 'false' }}
          emulate: ${{ matrix.emulate || '0' }}
          engine: ${{ matrix.engine }}
          python-version: ${{ matrix.python }}
          suites: complete

  test-sanitized:
    name: Test Sanitized (${{ matrix.engine }}, ${{ matrix.os }}, ${{ matrix.sanitize }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # No avx512ifma: a sanitized run under SDE is too slow to be worth it.
          # One sanitizer per leg: together they cost over 170x on aarch64,
          # where address alone costs 6x and undefined alone 1.4x.
          - { engine: portable, os: macos-26, sanitize: address }
          - { engine: portable, os: macos-26, sanitize: undefined }
          - { engine: portable, os: ubuntu-24.04, sanitize: address }
          - { engine: portable, os: ubuntu-24.04, sanitize: undefined }
          - { engine: portable, os: ubuntu-24.04-arm, sanitize: address }
          - { engine: portable, os: ubuntu-24.04-arm, sanitize: undefined }
          - { engine: neon, os: macos-26, sanitize: address }
          - { engine: neon, os: macos-26, sanitize: undefined }
          - { engine: neon, os: ubuntu-24.04-arm, sanitize: address }
          - { engine: neon, os: ubuntu-24.04-arm, sanitize: undefined }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run C suites sanitized
        uses: ./.github/actions/test-c
        with:
          engine: ${{ matrix.engine }}
          sanitize: ${{ matrix.sanitize }}
      # macOS has no LD_PRELOAD, so a Python job there would run uninstrumented.
      - name: Run Python suites sanitized
        if: runner.os == 'Linux'
        uses: ./.github/actions/test-python
        with:
          engine: ${{ matrix.engine }}
          sanitize: ${{ matrix.sanitize }}
          suites: fast

  # ------------------------------------------------------------------ dist ---

  release-build:
    name: Release Build
    uses: ./.github/workflows/release-build.yml

  # ----------------------------------------------------------------- smoke ---

  test-smoke:
    name: Test Smoke
    needs: [release-build]
    uses: ./.github/workflows/test-smoke.yml
    with:
      source: sdist

  # -------------------------------------------------------------------- ok ---

  ci-postsubmit-ok:
    name: CI Postsubmit OK
    if: always()
    needs:
      - lint
      - release-build
      - scan-vulnerability
      - test-c
      - test-python
      - test-sanitized
      - test-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Assert pipeline passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  # ----------------------------------------------------------------- alert ---

  alert:
    name: Alert
    if: failure() && github.event_name != 'workflow_dispatch'
    needs:
      - lint
      - release-build
      - scan-vulnerability
      - test-c
      - test-python
      - test-sanitized
      - test-smoke
    uses: ./.github/workflows/alert.yml
    permissions: {}
    secrets:
      zulip-api-key: ${{ secrets.ZULIP_API_KEY }}
