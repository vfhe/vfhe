# Push-to-main checks at complete depth; too slow for the merge gate.
name: CI Postsubmit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # a push is a record, not a race: never cancel one

jobs:
  # ---------------------------------------------------------------- checks ---

  static-checks:
    name: Static Checks
    uses: ./.github/workflows/static-checks.yml

  code-scanning:
    name: Code Scanning
    uses: ./.github/workflows/code-scanning.yml
    permissions:
      actions: read # analyser reads this run's metadata
      contents: read # checkout
      security-events: write # upload code-scanning results

  # ------------------------------------------------------------------ test ---

  c-tests:
    name: Test C (${{ matrix.engine }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { coverage: "1", engine: portable, os: ubuntu-24.04 }
          - { engine: portable, os: ubuntu-24.04-arm }
          - { engine: portable, os: macos-26 }
          - { coverage: "1", emulate: "1", engine: avx512ifma, os: ubuntu-24.04 }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run C suites
        uses: ./.github/actions/test-c
        with:
          coverage: ${{ matrix.coverage }}
          emulate: ${{ matrix.emulate }}
          engine: ${{ matrix.engine }}

  python-tests:
    name: Test Python (${{ matrix.engine }}, ${{ matrix.os }}, py${{ matrix.python }})
    needs: [c-tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: portable, os: macos-26, python: "3.10" }
          - { engine: portable, os: macos-26, python: "3.11" }
          - { engine: portable, os: macos-26, python: "3.12" }
          - { engine: portable, os: macos-26, python: "3.13" }
          - { engine: portable, os: macos-26, python: "3.14" }
          - { engine: portable, os: ubuntu-24.04, python: "3.10" }
          - { engine: portable, os: ubuntu-24.04, python: "3.11" }
          - { engine: portable, os: ubuntu-24.04, python: "3.12" }
          - { engine: portable, os: ubuntu-24.04, python: "3.13" }
          - { coverage: "1", engine: portable, os: ubuntu-24.04, python: "3.14" }
          - { engine: portable, os: ubuntu-24.04-arm, python: "3.10" }
          - { engine: portable, os: ubuntu-24.04-arm, python: "3.11" }
          - { engine: portable, os: ubuntu-24.04-arm, python: "3.12" }
          - { engine: portable, os: ubuntu-24.04-arm, python: "3.13" }
          - { engine: portable, os: ubuntu-24.04-arm, python: "3.14" }
          - { coverage: "1", emulate: "1", engine: avx512ifma, os: ubuntu-24.04, python: "3.14" }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run Python suites
        uses: ./.github/actions/test-python
        with:
          coverage: ${{ matrix.coverage }}
          emulate: ${{ matrix.emulate }}
          engine: ${{ matrix.engine }}
          python-version: ${{ matrix.python }}
          suites: complete

  sanitized-tests:
    name: Test Sanitized (${{ matrix.engine }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: portable, os: ubuntu-24.04 }
          - { engine: portable, os: macos-26 }
          # neon on arm64 runners when they exist: natively, or not at all
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run C suites sanitized
        uses: ./.github/actions/test-c
        with:
          engine: ${{ matrix.engine }}
          sanitize: address,undefined
      # macOS has no LD_PRELOAD, so a Python leg there would run uninstrumented.
      - name: Run Python suites sanitized
        if: runner.os == 'Linux'
        uses: ./.github/actions/test-python
        with:
          engine: ${{ matrix.engine }}
          sanitize: address,undefined
          suites: fast

  # -------------------------------------------------------------- coverage ---

  coverage-summary:
    name: Coverage Summary
    needs: [c-tests, python-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # legs its jobs uploaded
      contents: read # checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Merge legs
        uses: ./.github/actions/merge-coverage

  # ------------------------------------------------------------------ dist ---

  artifacts:
    name: Release Artifacts
    uses: ./.github/workflows/release-artifacts.yml

  # ----------------------------------------------------------------- smoke ---

  smoke-tests:
    name: Smoke Tests
    needs: [artifacts]
    uses: ./.github/workflows/smoke-tests.yml

  # ----------------------------------------------------------------- alert ---

  alert-channel:
    name: Alert Channel
    needs:
      [
        artifacts,
        code-scanning,
        coverage-summary,
        smoke-tests,
        static-checks,
        c-tests,
        python-tests,
        sanitized-tests,
      ]
    if: failure() && github.event_name == 'push'
    uses: ./.github/workflows/alert-channel.yml
    permissions: {}
    secrets:
      zulip-api-key: ${{ secrets.ZULIP_API_KEY }}
