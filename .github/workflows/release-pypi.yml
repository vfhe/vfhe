# Publishes a tagged version to PyPI, then verifies the published provenance.
name: Release PyPI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  # -------------------------------------------------------------- validate ---

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      checks: read # the check runs it waits on
      contents: read # checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # origin/main, which the containment assertion reads
          persist-credentials: false
      - name: Check the tag is bare semver
        env:
          TAG: ${{ github.ref_name }}
        run: echo "$TAG" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'
      - name: Wait for CI on main
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.sha }}
          check-name: CI Postsubmit OK
          allowed-conclusions: success # a skipped check is not a passed one
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
      - name: Wait for hardware tests on main
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.sha }}
          check-regexp: ^Test Hardware
          allowed-conclusions: success
          fail-on-no-checks: false
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

  release-notes:
    name: Release Notes
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up dev environment
        uses: ./.github/actions/setup-dev
        with:
          groups: ""
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          make release-notes CHANGELOG_VERSION="$TAG" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: release-notes
          overwrite: true
          path: release-notes.md
          retention-days: 7

  # ------------------------------------------------------------------ dist ---

  release-build:
    name: Release Build
    needs: [validate]
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read # checkout
    with:
      release-version: ${{ github.ref_name }}

  # --------------------------------------------------------------- publish ---

  publish:
    name: Publish
    needs: [release-build, release-notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/vfhe
    permissions:
      attestations: write # sign artifact provenance
      contents: write # create GitHub Release
      id-token: write # Trusted Publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download sdist and wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true
          path: dist
          pattern: dist-*
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Verify provenance before publishing
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh attestation verify dist/* --repo "$REPOSITORY" --bundle "$BUNDLE"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Create release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          provenance=provenance.intoto.jsonl  # codespell:ignore
          cp "$BUNDLE" "$provenance"
          gh release create "$TAG" dist/* "$provenance" \
            --notes-file release-notes.md --verify-tag

  # ----------------------------------------------------------------- prove ---

  test-smoke:
    name: Test Smoke
    needs: [publish]
    uses: ./.github/workflows/test-smoke.yml
    permissions:
      contents: read # checkout
    with:
      requirement: vfhe==${{ github.ref_name }}
      source: index

  verify-provenance:
    name: Verify Provenance
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: read # provenance published for this repository
      contents: read # the attestation names this repository
    steps:
      - name: Verify what the index serves
        shell: bash # for pipefail, so a failed curl is not masked by xargs
        env:
          API: https://pypi.org/pypi
          GH_TOKEN: ${{ github.token }}
          SIGNER: ${{ github.repository }}/.github/workflows/release-pypi.yml
          VERSION: ${{ github.ref_name }}
        run: |
          curl -sS "$API/vfhe/$VERSION/json" | jq -r '.urls[].url' |
            xargs curl -sSL --create-dirs --output-dir published --remote-name-all
          gh attestation verify published/* --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER"
