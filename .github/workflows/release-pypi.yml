# Publishes a tagged version to PyPI, then verifies the published provenance.
name: Release PyPI

on:
  workflow_dispatch:

concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions: {}

jobs:
  # -------------------------------------------------------------- validate ---

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # statuses main recorded for this commit
      contents: read # checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # origin/main, which the containment assertion reads
          persist-credentials: false
      - name: Assert this run is from a tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::run this workflow from a version tag (Use workflow from -> the tag)."; exit 1
          fi
      # PyPI takes bare X.Y.Z only, so users never see a pre-release and the tags stay one-to-one with releases.
      - name: Assert a bare-semver tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$TAG' is not X.Y.Z (no leading v, no pre-release)."; exit 1
          fi
      # Nothing releases from a side branch.
      - name: Assert the tag points into main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not in origin/main, so it must not be released."; exit 1
          fi
      - name: Assert CI passed on main
        uses: ./.github/actions/check-workflow-status
        with:
          presence: required
          workflow: CI Postsubmit
      - name: Assert hardware tests passed on main
        uses: ./.github/actions/check-workflow-status
        with:
          presence: optional
          workflow: Hardware Tests

  # A tag the changelog never documents fails here, before anything is built.
  release-notes:
    name: Release Notes
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up dev environment
        uses: ./.github/actions/setup-dev
        with:
          groups: ""
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: make release-notes VERSION="$TAG" > release-notes.md
      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: release-notes
          overwrite: true
          path: release-notes.md
          retention-days: 7

  # ------------------------------------------------------------------ dist ---

  artifacts:
    name: Release Artifacts
    needs: [validate]
    uses: ./.github/workflows/release-artifacts.yml
    permissions:
      contents: read # checkout
    with:
      release-version: ${{ github.ref_name }}

  # --------------------------------------------------------------- publish ---

  publish:
    name: Publish
    needs: [artifacts, release-notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/vfhe
    permissions:
      attestations: write # sign artifact provenance
      contents: write # create GitHub Release
      id-token: write # Trusted Publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download sdist and wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true
          path: dist
          pattern: dist-*
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom
          path: sbom
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Verify the provenance before publishing
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh attestation verify dist/* --repo "$REPOSITORY" --bundle "$BUNDLE"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Create release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp "$BUNDLE" provenance.intoto.jsonl
          gh release create "$TAG" dist/* sbom/sbom.json provenance.intoto.jsonl \
            --notes-file release-notes.md --verify-tag

  # ----------------------------------------------------------------- prove ---

  smoke-tests:
    name: Smoke Tests (PyPI)
    needs: [publish]
    uses: ./.github/workflows/smoke-tests.yml
    permissions:
      contents: read # checkout
    with:
      requirement: vfhe==${{ github.ref_name }}

  verify-provenance:
    name: Verify Provenance
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: read # provenance published for this repository
      contents: read # attestation names this repository
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify what index serves
        uses: ./.github/actions/verify-provenance
        with:
          package: vfhe
          signer-workflow: ${{ github.repository }}/.github/workflows/release-pypi.yml
          version: ${{ github.ref_name }}

  # ----------------------------------------------------------------- alert ---

  alert-channel:
    name: Alert Channel
    needs:
      [
        artifacts,
        publish,
        release-notes,
        smoke-tests,
        validate,
        verify-provenance,
      ]
    if: failure()
    uses: ./.github/workflows/alert-channel.yml
    permissions: {}
    secrets:
      zulip-api-key: ${{ secrets.ZULIP_API_KEY }}
