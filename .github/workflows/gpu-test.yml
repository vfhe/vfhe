# The CUDA extension's suites on the self-hosted GPU runner; hosted runners have no device.
name: GPU Test

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read # checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # a push is a record, not a race: never cancel one

jobs:
  # ------------------------------------------------------------------- gpu ---

  test-gpu:
    name: Test GPU (cuda)
    runs-on: [self-hosted, Linux, X64, cuda]
    container:
      image: ghcr.io/vfhe/vfhe-gpu:latest # zizmor: ignore[unpinned-images]
      options: --gpus all
    timeout-minutes: 120
    permissions:
      contents: read # checkout
      packages: read # pull the job container from this registry
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Trust the checkout
        # The container runs as root over a workspace owned by the runner user.
        run: git config --global --add safe.directory '*'
      - name: Set up dev environment
        uses: ./.github/actions/setup-dev
        with:
          groups: test
          pip-cache: false
      - name: Build with the CUDA extension
        run: meson setup build -Dcuda=enabled
      - name: Run the Python suites
        run: make test ENGINE=portable SUITES=complete

  # ----------------------------------------------------------------- alert ---

  alert:
    name: Alert
    if: failure() && github.event_name != 'workflow_dispatch'
    needs:
      - test-gpu
    uses: ./.github/workflows/alert.yml
    permissions: {}
    secrets:
      zulip-api-key: ${{ secrets.ZULIP_API_KEY }}
