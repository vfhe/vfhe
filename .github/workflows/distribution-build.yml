# Builds the sdist and the wheels, at a release version or one derived from the tree.
name: Distribution Build

on:
  workflow_call:
    inputs:
      interpreters:
        description: JSON array of cibuildwheel interpreter tags to build.
        type: string
        default: '["cp310", "cp311", "cp312", "cp313", "cp314"]'
      release-version:
        description: Version of the distribution; empty derives one from the tree.
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      interpreters:
        description: JSON array of cibuildwheel interpreter tags to build.
        type: string
        default: '["cp310", "cp311", "cp312", "cp313", "cp314"]'
      release-version:
        description: Version of the distribution; empty derives one from the tree.
        type: string
        default: ""

permissions:
  contents: read # checkout

concurrency:
  group: distribution-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --------------------------------------------------------------- version ---

  # Only a tag names a version outright. Everywhere else setuptools-scm derives
  # one, and a pull request stamps its number into the local segment so its
  # artifacts stay distinguishable from main's at the same commit count.
  dev-version:
    name: Dev Version
    if: inputs.release-version == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      value: ${{ steps.scm.outputs.value }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags are what the version is derived from
          persist-credentials: false
      - name: Set up dev environment
        uses: ./.github/actions/setup-dev
        with:
          groups: compile
      - name: Read version
        id: scm
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          value=$(python tools/meson/print_version.py)
          if [ -n "$PULL_REQUEST" ]; then
            case "$value" in
              *+*) value="$value.pr$PULL_REQUEST" ;;
              *) value="$value+pr$PULL_REQUEST" ;;
            esac
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------- sdist ---

  sdist:
    name: Sdist
    needs: [dev-version]
    if: ${{ !cancelled() && needs.dev-version.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_CONSTRAINT: ci-constraints-requirements.txt
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VFHE: ${{ inputs.release-version || needs.dev-version.outputs.value }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up dev environment
        uses: ./.github/actions/setup-dev
        with:
          groups: release
          pip-cache: "false"
      - name: Build sdist
        run: make sdist
      - name: Check package metadata
        run: twine check --strict dist/*.tar.gz
      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: dist-sdist
          overwrite: true
          path: dist/*.tar.gz
          retention-days: 7

  # ---------------------------------------------------------------- wheels ---

  # One interpreter per leg; cibuildwheel builds and tests a tag's wheels serially.
  wheels:
    name: Wheels (${{ matrix.os }}, ${{ matrix.python }})
    needs: [dev-version]
    if: ${{ !cancelled() && needs.dev-version.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
        python: ${{ fromJSON(inputs.interpreters) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build wheels
        uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c # v4.1.1
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          # The manylinux build runs in a container, which inherits nothing.
          CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VFHE
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VFHE: ${{ inputs.release-version || needs.dev-version.outputs.value }}
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: dist-wheels-${{ matrix.os }}-${{ matrix.python }}
          overwrite: true
          path: wheelhouse/*.whl
          retention-days: 7
