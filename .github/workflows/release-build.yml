# Builds the sdist and the wheels at the version pyproject.toml declares.
name: Release Build

on:
  workflow_call:
    inputs:
      interpreters:
        description: JSON array of cibuildwheel interpreter tags to build.
        type: string
        default: '["cp310", "cp311", "cp312", "cp313", "cp314"]'
  workflow_dispatch:
    inputs:
      interpreters:
        description: JSON array of cibuildwheel interpreter tags to build.
        type: string
        default: '["cp310", "cp311", "cp312", "cp313", "cp314"]'

permissions:
  contents: read # checkout

# Named literally because github.workflow inside a call names the caller, whose
# group this would then be: a run waiting on itself is cancelled as a deadlock.
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------- sdist ---

  sdist:
    name: Sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_CONSTRAINT: ci-constraints-requirements.txt
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up dev environment
        uses: ./.github/actions/setup-dev
        with:
          groups: release
          pip-cache: "false"
      - name: Build sdist
        run: make sdist
      - name: Check package metadata
        run: twine check --strict dist/*.tar.gz
      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: dist-sdist
          overwrite: true
          path: dist/*.tar.gz
          retention-days: 7

  # ---------------------------------------------------------------- wheels ---

  wheels:
    name: Wheels (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
        python: ${{ fromJSON(inputs.interpreters) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          output-dir: dist
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
      - name: Set up dev environment
        uses: ./.github/actions/setup-dev
        with:
          groups: publish
      - name: Embed SBOM
        run: make sbom-embed
      - name: Check package metadata
        run: twine check --strict dist/*.whl
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: dist-wheels-${{ matrix.os }}-${{ matrix.python }}
          overwrite: true
          path: dist/*.whl
          retention-days: 7
