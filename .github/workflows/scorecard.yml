# Runs OpenSSF Scorecard and uploads its SARIF to code scanning.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "15 1 * * 1"
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------- analyze ---

  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # workflow and run metadata
      checks: read # CI results the score reads
      contents: read # checkout
      id-token: write # publish_results
      issues: read # maintenance signals
      pull-requests: read # review signals
      security-events: write # upload code-scanning results
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          publish_results: true
          results_file: results.sarif
          results_format: sarif
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: scorecard-results
          overwrite: true
          path: results.sarif
          retention-days: 7
      - name: Upload to CodeQL
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: results.sarif

  # ----------------------------------------------------------------- alert ---

  alert:
    name: Alert
    if: failure()
    needs:
      - analyze
    uses: ./.github/workflows/alert.yml
    permissions: {}
    secrets:
      zulip-api-key: ${{ secrets.ZULIP_API_KEY }}
