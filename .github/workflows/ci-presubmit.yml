# Pull request checks; branch protection requires this workflow's CI OK job.
name: CI Presubmit

on:
  pull_request:

permissions:
  contents: read # checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------- prepare ---

  changes:
    name: Change Classification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify paths
        id: classify
        uses: ./.github/actions/classify-changes

  # ---------------------------------------------------------------- checks ---

  static-checks:
    name: Static Checks
    uses: ./.github/workflows/static-checks.yml

  code-scanning:
    name: Code Scanning
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    uses: ./.github/workflows/code-scanning.yml
    permissions:
      actions: read # analyser reads this run's metadata
      contents: read # checkout
      security-events: write # upload code-scanning results

  dco:
    name: DCO Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
      pull-requests: read # dco-check reads the commits through the API
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # every commit in pull request, not just its head
          persist-credentials: false
      - name: Set up dev environment
        uses: ./.github/actions/setup-dev
        with:
          groups: lint
      - name: Check DCO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dco-check --verbose --default-branch main \
            --exclude-pattern '.+\[bot\]@users\.noreply\.github\.com'

  dependency-review:
    name: Dependency Review
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Build tooling: cyclonedx-bom pulls chardet and rfc3987-syntax, gcovr
          # pulls lxml, twine pulls docutils. Each sdist carries copyleft docs or
          # test data, which the scanner ANDs into one expression, so a
          # term-level policy cannot separate them from what the wheel ships.
          # TODO: Validate correctness
          allow-dependencies-licenses: >-
            pkg:pypi/chardet, pkg:pypi/docutils, pkg:pypi/lxml,
            pkg:pypi/rfc3987-syntax
          allow-licenses: >-
            Apache-2.0, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, ISC, PSF-2.0,
            Python-2.0, MPL-2.0, CC-BY-4.0, CC-PDDC, 0BSD, Unlicense,
            Apache-2.0 WITH LLVM-exception, LicenseRef-scancode-protobuf,
            LicenseRef-scancode-public-domain

  # ------------------------------------------------------------------ test ---

  c-tests:
    name: Test C (${{ matrix.engine }}, ${{ matrix.os }})
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { coverage: "1", engine: portable, os: ubuntu-24.04 }
          - { engine: portable, os: ubuntu-24.04-arm }
          - { engine: portable, os: macos-26 }
          - { coverage: "1", emulate: "1", engine: avx512ifma, os: ubuntu-24.04 }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run C suites
        uses: ./.github/actions/test-c
        with:
          coverage: ${{ matrix.coverage }}
          emulate: ${{ matrix.emulate }}
          engine: ${{ matrix.engine }}

  python-tests:
    name: Test Python (${{ matrix.engine }}, ${{ matrix.os }}, py${{ matrix.python }})
    if: needs.changes.outputs.code == 'true'
    needs: [changes, c-tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: portable, os: ubuntu-24.04, python: "3.10" }
          - { coverage: "1", engine: portable, os: ubuntu-24.04, python: "3.14" }
          - { engine: portable, os: ubuntu-24.04-arm, python: "3.10" }
          - { engine: portable, os: ubuntu-24.04-arm, python: "3.14" }
          - { engine: portable, os: macos-26, python: "3.10" }
          - { engine: portable, os: macos-26, python: "3.14" }
          - { coverage: "1", emulate: "1", engine: avx512ifma, os: ubuntu-24.04, python: "3.14" }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run Python suites
        uses: ./.github/actions/test-python
        with:
          coverage: ${{ matrix.coverage }}
          emulate: ${{ matrix.emulate }}
          engine: ${{ matrix.engine }}
          python-version: ${{ matrix.python }}
          suites: fast

  sanitized-tests:
    name: Test Sanitized (${{ matrix.engine }}, ${{ matrix.os }})
    if: needs.changes.outputs.code == 'true'
    needs: [changes, c-tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: portable, os: ubuntu-24.04 }
          - { engine: portable, os: macos-26 }
          # neon on arm64 runners when they exist: natively, or not at all
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run C suites sanitized
        uses: ./.github/actions/test-c
        with:
          engine: ${{ matrix.engine }}
          sanitize: address,undefined
      # macOS has no LD_PRELOAD, so a Python leg there would run uninstrumented.
      - name: Run Python suites sanitized
        if: runner.os == 'Linux'
        uses: ./.github/actions/test-python
        with:
          engine: ${{ matrix.engine }}
          sanitize: address,undefined
          suites: fast

  # -------------------------------------------------------------- coverage ---

  coverage-summary:
    name: Coverage Summary
    needs: [c-tests, python-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # legs its jobs uploaded
      contents: read # checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Merge legs
        uses: ./.github/actions/merge-coverage

  coverage-comment:
    name: Coverage Comment
    needs: [coverage-summary]
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # download table coverage-summary uploaded
      pull-requests: write # sticky comment
    steps:
      - name: Download summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-summary
      - name: Comment on pull request
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          path: summary.md

  # ------------------------------------------------------------------ fuzz ---

  fuzz-changed-code:
    name: Fuzz Changed Code
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read # gh-actions filestore keeps corpus in artifacts
      contents: read # checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          fuzz-seconds: 300
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: code-change

  # ------------------------------------------------------------------ dist ---

  distribution-build:
    name: Distribution Build
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    uses: ./.github/workflows/distribution-build.yml
    with:
      # The interpreter bounds, as everywhere else on the gate. Main builds the rest.
      interpreters: '["cp310", "cp314"]'

  # ----------------------------------------------------------------- smoke ---

  smoke-tests:
    name: Smoke Tests
    needs: [distribution-build]
    uses: ./.github/workflows/smoke-tests.yml

  # ------------------------------------------------------------------ gate ---

  ci-ok:
    name: CI OK
    if: always()
    needs:
      [
        changes,
        code-scanning,
        dco,
        dependency-review,
        fuzz-changed-code,
        distribution-build,
        smoke-tests,
        static-checks,
        c-tests,
        python-tests,
        sanitized-tests,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    # A docs-only pull request may skip exactly these; a code change may skip none.
    env:
      SKIPPABLE: code-scanning, dependency-review, distribution-build, fuzz-changed-code, smoke-tests, c-tests, python-tests, sanitized-tests
    steps:
      - name: Assert every job succeeded
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-skips: ${{ needs.changes.outputs.code == 'false' && env.SKIPPABLE || '' }}
          jobs: ${{ toJSON(needs) }}
