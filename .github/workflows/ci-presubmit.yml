# Pull request checks; branch protection requires this workflow's CI Presubmit OK.
name: CI Presubmit

on:
  pull_request:

permissions:
  contents: read # checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- checks ---

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  scan-vulnerability:
    name: Scan Vulnerability
    uses: ./.github/workflows/scan-vulnerability.yml
    permissions:
      actions: read # analyser reads this run's metadata
      contents: read # checkout
      security-events: write # upload code-scanning results

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Build tooling: gcovr pulls lxml, twine pulls docutils. Each sdist
          # carries copyleft docs or test data, which the scanner ANDs into one
          # expression, so a term-level policy cannot separate them from what
          # the wheel ships.
          allow-dependencies-licenses: >-
            pkg:pypi/docutils, pkg:pypi/lxml
          allow-licenses: >-
            Apache-2.0, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, ISC, PSF-2.0,
            Python-2.0, MPL-2.0, CC-BY-4.0, CC-PDDC, 0BSD, Unlicense,
            Apache-2.0 WITH LLVM-exception, LicenseRef-scancode-protobuf,
            LicenseRef-scancode-public-domain

  # ------------------------------------------------------------------ test ---

  test-c:
    name: Test C (${{ matrix.engine }}, ${{ matrix.os }})
    permissions:
      contents: read # checkout
      id-token: write # Codecov upload, instead of a stored token
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: portable, os: macos-26 }
          - { engine: portable, os: ubuntu-24.04, coverage: "true" }
          - { engine: portable, os: ubuntu-24.04-arm }
          - { engine: avx512ifma, os: ubuntu-24.04, coverage: "true", emulate: "1" }
          - { engine: neon, os: macos-26 }
          - { engine: neon, os: ubuntu-24.04-arm, coverage: "true" }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run C suites
        uses: ./.github/actions/test-c
        with:
          coverage: ${{ matrix.coverage || 'false' }}
          emulate: ${{ matrix.emulate || '0' }}
          engine: ${{ matrix.engine }}

  test-python:
    name: Test Python (${{ matrix.engine }}, ${{ matrix.os }}, py${{ matrix.python }})
    permissions:
      contents: read # checkout
      id-token: write # Codecov upload, instead of a stored token
    needs: [test-c]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: portable, os: macos-26, python: "3.10" }
          - { engine: portable, os: macos-26, python: "3.14" }
          - { engine: portable, os: ubuntu-24.04, python: "3.10" }
          - { engine: portable, os: ubuntu-24.04, python: "3.14", coverage: "true" }
          - { engine: portable, os: ubuntu-24.04-arm, python: "3.10" }
          - { engine: portable, os: ubuntu-24.04-arm, python: "3.14" }
          - { engine: avx512ifma, os: ubuntu-24.04, python: "3.14", coverage: "true", emulate: "1" }
          - { engine: neon, os: macos-26, python: "3.14" }
          - { engine: neon, os: ubuntu-24.04-arm, python: "3.14", coverage: "true" }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run Python suites
        uses: ./.github/actions/test-python
        with:
          coverage: ${{ matrix.coverage || 'false' }}
          emulate: ${{ matrix.emulate || '0' }}
          engine: ${{ matrix.engine }}
          python-version: ${{ matrix.python }}
          suites: fast

  test-sanitized:
    name: Test Sanitized (${{ matrix.engine }}, ${{ matrix.os }}, ${{ matrix.sanitize }})
    needs: [test-c]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # No avx512ifma: a sanitized run under SDE is too slow to be worth it.
          # One sanitizer per leg: together they cost over 170x on aarch64,
          # where address alone costs 6x and undefined alone 1.4x.
          - { engine: portable, os: macos-26, sanitize: address }
          - { engine: portable, os: macos-26, sanitize: undefined }
          - { engine: portable, os: ubuntu-24.04, sanitize: address }
          - { engine: portable, os: ubuntu-24.04, sanitize: undefined }
          - { engine: neon, os: macos-26, sanitize: address }
          - { engine: neon, os: macos-26, sanitize: undefined }
          - { engine: neon, os: ubuntu-24.04-arm, sanitize: address }
          - { engine: neon, os: ubuntu-24.04-arm, sanitize: undefined }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run C suites sanitized
        uses: ./.github/actions/test-c
        with:
          engine: ${{ matrix.engine }}
          sanitize: ${{ matrix.sanitize }}
      # macOS has no LD_PRELOAD, so a Python job there would run uninstrumented.
      - name: Run Python suites sanitized
        if: runner.os == 'Linux'
        uses: ./.github/actions/test-python
        with:
          engine: ${{ matrix.engine }}
          sanitize: ${{ matrix.sanitize }}
          suites: fast

  # ------------------------------------------------------------------ fuzz ---

  fuzz-changed-code:
    name: Fuzz Changed Code
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read # gh-actions filestore keeps corpus in artifacts
      contents: read # checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          fuzz-seconds: 300
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: code-change

  # ------------------------------------------------------------------ dist ---

  release-build:
    name: Release Build
    uses: ./.github/workflows/release-build.yml
    with:
      interpreters: '["cp310", "cp314"]'

  # ----------------------------------------------------------------- smoke ---

  test-smoke:
    name: Test Smoke
    needs: [release-build]
    uses: ./.github/workflows/test-smoke.yml
    with:
      source: sdist

  # -------------------------------------------------------------------- ok ---

  ci-presubmit-ok:
    name: CI Presubmit OK
    if: always()
    needs:
      - dependency-review
      - fuzz-changed-code
      - lint
      - release-build
      - scan-vulnerability
      - test-c
      - test-python
      - test-sanitized
      - test-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Assert pipeline passed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
