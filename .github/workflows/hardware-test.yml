# Hardware tests on the self-hosted runner; hosted runners can lack ISA undeterministically.
name: Hardware Test

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read # checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # a push is a record, not a race: never cancel one

jobs:
  # ------------------------------------------------------------------- cpu ---

  test-hardware:
    name: Test Hardware (avx512ifma)
    runs-on: [self-hosted, Linux, X64, avx512ifma]
    container:
      image: ghcr.io/vfhe/vfhe-hardware:latest # zizmor: ignore[unpinned-images]
      options: --privileged
    timeout-minutes: 120
    permissions:
      contents: read # checkout
      packages: read # pull the job container from this registry
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Trust the checkout
        # The container runs as root over a workspace owned by the runner user.
        run: git config --global --add safe.directory '*'
      - name: Set up dev environment
        uses: ./.github/actions/setup-dev
        with:
          groups: smoke
          pip-cache: false
      - name: Run C suites natively
        uses: ./.github/actions/test-c
        with:
          engine: avx512ifma
          pip-cache: false
      - name: Run Python suites natively
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test-python
        with:
          engine: avx512ifma
          pip-cache: false
          suites: complete
      - name: Run C suites sanitized
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test-c
        with:
          engine: avx512ifma
          pip-cache: false
          sanitize: address,undefined
      - name: Run Python suites sanitized
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test-python
        with:
          engine: avx512ifma
          pip-cache: false
          sanitize: address,undefined
          suites: fast
      - name: Smoke test an installed package
        if: ${{ !cancelled() }}
        run: make smoke

  # ------------------------------------------------------------------- gpu ---

  test-gpu:
    name: Test GPU (cuda)

    runs-on: [self-hosted, Linux, X64, cuda]
    container:
      image: ghcr.io/vfhe/vfhe-hardware-cuda:latest # zizmor: ignore[unpinned-images]
      options: --gpus all
    timeout-minutes: 120
    permissions:
      contents: read # checkout
      packages: read # pull the job container from this registry
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Trust the checkout
        # The container runs as root over a workspace owned by the runner user.
        run: git config --global --add safe.directory '*'
      - name: Set up dev environment
        uses: ./.github/actions/setup-dev
        with:
          groups: test
          pip-cache: false
      - name: Build with the CUDA extension
        run: meson setup build -Dcuda=enabled
      - name: Run the Python suites
        run: make test ENGINE=portable SUITES=complete

  # ----------------------------------------------------------------- alert ---

  alert:
    name: Alert
    if: failure() && github.event_name != 'workflow_dispatch'
    needs:
      - test-hardware
      - test-gpu
    uses: ./.github/workflows/alert.yml
    permissions: {}
    secrets:
      zulip-api-key: ${{ secrets.ZULIP_API_KEY }}
