# Nightly ClusterFuzzLite sessions, corpus prunes and coverage reports, one job per engine.
name: Test Fuzz Batch

on:
  schedule:
    - cron: "45 0 * * *"

env:
  FUZZ_SECONDS: "3600"
  PRUNE_SECONDS: "600"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read # checkout

jobs:
  # ------------------------------------------------------------------ fuzz ---

  fuzz-batch:
    name: Fuzz Batch (${{ matrix.engine }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        # No neon: ClusterFuzzLite's action images have no arm builds.
        include:
          - { engine: portable, runner: [ubuntu-24.04] }
          - { engine: avx512ifma, runner: [self-hosted, Linux, X64, avx512ifma] }
    permissions:
      actions: read # gh-actions filestore keeps corpus in artifacts
      contents: read # checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: State the engine to fuzz
        env:
          ENGINE: ${{ matrix.engine }}
        run: printf 'VFHE_ENGINE=%s\n' "$ENGINE" > .clusterfuzzlite/.env
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
      # continue-on-error: run_fuzzers exits 2 on BUG_FOUND even in batch mode.
      # A crash reproduces every night until it is fixed, so failing here would
      # cost us the prune and the coverage report for as long as the bug is open.
      - name: Run fuzzers
        id: batch
        continue-on-error: true
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          fuzz-seconds: ${{ env.FUZZ_SECONDS }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: batch
          output-sarif: true
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crash-artifacts-${{ matrix.engine }}
          path: out/artifacts/
          if-no-files-found: ignore
          retention-days: 90
      # run_fuzzers refuses to start on a non-empty out/artifacts, so clear it
      # after each run. CFL's docker owns the files as root (passwordless).
      - name: Clear crash artifacts after the batch run
        if: always()
        run: sudo rm -rf out/artifacts
      - name: Prune corpus
        id: prune
        continue-on-error: true
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          fuzz-seconds: ${{ env.PRUNE_SECONDS }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: prune
          output-sarif: true
      - name: Clear crash artifacts before coverage replay
        if: always()
        run: sudo rm -rf out/artifacts
      - name: Build fuzzers for coverage
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
          sanitizer: coverage
      - name: Generate coverage report
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: coverage
          sanitizer: coverage
      - name: Fail if a fuzzing run found crashes
        if: steps.batch.outcome == 'failure' || steps.prune.outcome == 'failure'
        env:
          BATCH: ${{ steps.batch.outcome }}
          PRUNE: ${{ steps.prune.outcome }}
        run: |
          printf 'batch: %s\nprune: %s\n' "$BATCH" "$PRUNE"
          exit 1

  # ----------------------------------------------------------------- alert ---

  alert:
    name: Alert
    if: failure()
    needs:
      - fuzz-batch
    uses: ./.github/workflows/alert.yml
    permissions: {}
    secrets:
      zulip-api-key: ${{ secrets.ZULIP_API_KEY }}
