# Code analysis, one build per engine; an analyser sees only what compiled.
name: Code Scanning

on:
  schedule:
    - cron: "15 3 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read # checkout

concurrency:
  # Literal: github.workflow is the caller's name, so it would collide with theirs.
  group: code-scanning-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --------------------------------------------------------------- analyze ---

  analyze-python:
    name: Analyze Python
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read # the analyser reads this run's metadata
      contents: read # checkout
      security-events: write # upload code-scanning results
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize analyser
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          build-mode: none
          languages: python
      - name: Run analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:python"

  analyze-c:
    name: Analyze C (${{ matrix.engine }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read # the analyser reads this run's metadata
      contents: read # checkout
      security-events: write # upload code-scanning results
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: portable, os: ubuntu-24.04 }
          - { engine: portable, os: macos-26 }
          - { engine: avx512ifma, os: ubuntu-24.04 }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up dev environment
        uses: ./.github/actions/setup-dev
        with:
          groups: compile
      - name: Initialize analyser
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          build-mode: manual
          languages: c-cpp
      - name: Compile engine kernels
        env:
          ENGINE: ${{ matrix.engine }}
        run: make build KERNELS="$ENGINE"
      - name: Run analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:c-cpp/${{ matrix.engine }}/${{ matrix.os }}"

  # ----------------------------------------------------------------- alert ---

  alert-channel:
    name: Alert Channel
    needs: [analyze-c, analyze-python]
    if: failure() && github.event_name == 'schedule'
    uses: ./.github/workflows/alert-channel.yml
    permissions: {}
    secrets:
      zulip-api-key: ${{ secrets.ZULIP_API_KEY }}
