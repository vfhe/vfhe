# Publishes a pre-release to TestPyPI.
name: Release TestPyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of the distribution.
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  # -------------------------------------------------------------- validate ---

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      checks: read # the check runs it waits on
      contents: read # checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the version is a release or a candidate
        env:
          VERSION: ${{ inputs.version }}
        run: echo "$VERSION" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.dev[0-9]+)?'
      - name: Wait for CI on main
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.sha }}
          check-name: CI Postsubmit OK
          allowed-conclusions: success # a skipped check is not a passed one
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
      - name: Wait for hardware tests on main
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.sha }}
          check-regexp: ^Test Hardware
          allowed-conclusions: success
          fail-on-no-checks: false
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

  # ------------------------------------------------------------------ dist ---

  release-build:
    name: Release Build
    needs: [validate]
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read # checkout
    with:
      release-version: ${{ inputs.version }}

  # --------------------------------------------------------------- publish ---

  publish:
    name: Publish
    needs: [release-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vfhe
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - name: Download sdist and wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true
          path: dist
          pattern: dist-*
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # ----------------------------------------------------------------- prove ---

  test-smoke:
    name: Test Smoke
    needs: [publish]
    uses: ./.github/workflows/test-smoke.yml
    permissions:
      contents: read # checkout
    with:
      index: testpypi
      requirement: vfhe==${{ inputs.version }}
      source: index

  verify-provenance:
    name: Verify Provenance
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: read # provenance published for this repository
      contents: read # the attestation names this repository
    steps:
      - name: Verify what the index serves
        shell: bash # for pipefail, so a failed curl is not masked by xargs
        env:
          API: https://test.pypi.org/pypi
          GH_TOKEN: ${{ github.token }}
          SIGNER: ${{ github.repository }}/.github/workflows/release-testpypi.yml
          VERSION: ${{ inputs.version }}
        run: |
          curl -sS "$API/vfhe/$VERSION/json" | jq -r '.urls[].url' |
            xargs curl -sSL --create-dirs --output-dir published --remote-name-all
          gh attestation verify published/* --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER"
