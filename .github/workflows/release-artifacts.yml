# Builds the distributions and the CycloneDX SBOM for both release targets.
name: Release Artifacts

on:
  workflow_call:
    inputs:
      release-version:
        description: Version of the distribution; empty derives one from the tree.
        type: string
        default: ""

permissions:
  contents: read # checkout

jobs:
  # ------------------------------------------------------------------ dist ---

  distribution-build:
    name: Distribution Build
    uses: ./.github/workflows/distribution-build.yml
    with:
      release-version: ${{ inputs.release-version }}

  # ------------------------------------------------------------------ sbom ---

  sbom:
    name: SBOM
    needs: [distribution-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-sdist
          path: dist
      - name: Install release group
        run: python -m pip install --constraint ci-constraints-requirements.txt --group release
      - name: Generate SBOM
        run: make sbom DIST=dist/*.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: sbom
          overwrite: true
          path: dist/sbom.json
          retention-days: 7
