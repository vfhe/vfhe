# Installs a published version on self-hosted; checks runtime engine selection.
name: Hardware Smoke Tests

on:
  workflow_call:
    inputs:
      index:
        description: Which index to install from, pypi or testpypi.
        type: string
        default: pypi
      version:
        description: Version to install; empty takes whatever the index serves now.
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      index:
        description: Which index to install from.
        type: choice
        options: [pypi, testpypi]
        default: pypi
      version:
        description: Version to install; empty takes whatever the index serves now.
        default: ""

permissions:
  contents: read # checkout

concurrency:
  group: hardware-smoke-tests
  cancel-in-progress: false

jobs:
  # Minutes, not hours: this is the one dispatch allowed to queue on that runner.
  smoke-tests:
    name: Smoke Tests (silicon)
    runs-on: [self-hosted, Linux, X64, avx512ifma]
    container:
      image: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up dev environment
        uses: ./.github/actions/setup-dev
        with:
          groups: compile
      # Unpinned: the picker choosing avx512ifma is itself what is under test.
      - name: Install from the index and run smoke
        env:
          INDEX: ${{ inputs.index }}
          PACKAGE: vfhe${{ inputs.version && format('=={0}', inputs.version) || '' }}
        run: make smoke DIST="$PACKAGE" INDEX="$INDEX"
