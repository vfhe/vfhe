name: C suites
description: Run the C unit tests for one engine, optionally emulated, sanitized or measured.

inputs:
  coverage:
    description: "true instruments the build and uploads this engine's coverage data."
    default: "false"
  emulate:
    description: "1 runs it under the emulator the registry names for that engine."
    default: "0"
  engine:
    description: Engine to build and test.
    required: true
  pip-cache:
    description: Forwarded to setup-dev; false in a job container.
    required: false
    default: "true"
  sanitize:
    description: meson's -Db_sanitize; none is the release shape.
    default: none

runs:
  using: composite
  steps:
    # --------------------------------------------------------------- setup ---
    - name: Set up dev environment
      uses: ./.github/actions/setup-dev
      with:
        groups: test
        pip-cache: ${{ inputs.pip-cache }}
    - name: Set up Intel SDE
      if: inputs.emulate == '1'
      uses: ./.github/actions/setup-sde
    # ----------------------------------------------------------------- run ---
    - name: Run C suites
      shell: bash
      env:
        COVERAGE: ${{ inputs.coverage }}
        EMULATE: ${{ inputs.emulate }}
        ENGINE: ${{ inputs.engine }}
        SANITIZE: ${{ inputs.sanitize }}
      run: |
        make test ENGINE="$ENGINE" SUITES=c EMULATE="$EMULATE" \
          VFHE_SANITIZE="$SANITIZE" VFHE_COVERAGE="$COVERAGE"
    # ------------------------------------------------------------- measure ---
    - name: Upload C coverage
      if: inputs.coverage == 'true'
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
      with:
        directory: build/meson-logs
        disable_search: false
        fail_ci_if_error: false
        use_oidc: true
