name: Set up Intel SDE
description: >
  Provision Intel SDE: restore its cache, download on a miss (sha256-checked;
  Linux only.

runs:
  using: composite
  steps:
    - name: Cache Intel SDE
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: sde-${{ hashFiles('tools/sde/fetch.sh') }}
        path: .cache/sde
    - name: Download SDE
      shell: bash
      run: tools/sde/fetch.sh
    # Yama (ptrace_scope=1) blocks SDE from detaching from compiler subprocesses.
    - name: Let SDE manage subprocesses
      shell: bash
      run: sudo sysctl -w kernel.yama.ptrace_scope=0
