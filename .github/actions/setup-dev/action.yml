name: Set up dev environment
description: Python and the pinned dev dependency group; shared by the preamble of CI jobs.

inputs:
  groups:
    description: Dependency groups to install; empty installs the interpreter alone.
    required: true
  pip-cache:
    description: Restore pip's cache; false in a job container, whose HOME pip
      refuses to own, and where a build must resolve fresh.
    required: false
    default: "true"
  python-version:
    description: Interpreter to install; empty takes the repo's .python-version pin.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        cache: ${{ inputs.pip-cache == 'true' && 'pip' || '' }}
        cache-dependency-path: |
          pyproject.toml
          ci-constraints-requirements.txt
        # The explicit input (matrix jobs) wins; otherwise the repo .python-version pin.
        python-version: ${{ inputs.python-version }}
        python-version-file: .python-version
    # Every action sets itself up; the marker makes the repeats a no-op.
    - name: Install dev dependencies
      if: inputs.groups != ''
      shell: bash
      env:
        DEPENDENCY_GROUPS: ${{ inputs.groups }}
        MARKER: ${{ runner.temp }}/vfhe-deps-${{ steps.python.outputs.python-version }}-${{ inputs.groups }}
        PIP_CONSTRAINT: ci-constraints-requirements.txt
      run: |
        if [ ! -e "$MARKER" ]; then
          make deps DEPENDENCY_GROUPS="$DEPENDENCY_GROUPS"
          touch "$MARKER"
        fi
