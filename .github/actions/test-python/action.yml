name: Python suites
description: Run the Python suites for one engine, optionally emulated, sanitized or measured.

inputs:
  coverage:
    description: "true instruments the build and uploads this engine's coverage data."
    default: "false"
  emulate:
    description: "1 runs it under the emulator the registry names for that engine."
    default: "0"
  engine:
    description: Engine the extension is built for.
    required: true
  pip-cache:
    description: Forwarded to setup-dev; false in a job container.
    required: false
    default: "true"
  python-version:
    description: Interpreter this job runs on; empty takes the repo pin.
    default: ""
  sanitize:
    description: meson's -Db_sanitize; none is the release shape a wheel carries.
    default: none
  suites:
    description: Depth - fast (subset) or complete (all).
    required: true

runs:
  using: composite
  steps:
    # --------------------------------------------------------------- setup ---
    - name: Set up dev environment
      uses: ./.github/actions/setup-dev
      with:
        groups: test
        python-version: ${{ inputs.python-version }}
        pip-cache: ${{ inputs.pip-cache }}
    - name: Set up Intel SDE
      if: inputs.emulate == '1'
      uses: ./.github/actions/setup-sde
    # ----------------------------------------------------------------- run ---
    - name: Run Python suites
      shell: bash
      env:
        COVERAGE: ${{ inputs.coverage }}
        EMULATE: ${{ inputs.emulate }}
        ENGINE: ${{ inputs.engine }}
        SANITIZE: ${{ inputs.sanitize }}
        SUITES: ${{ inputs.suites }}
      run: |
        make test ENGINE="$ENGINE" SUITES="$SUITES" EMULATE="$EMULATE" \
          VFHE_SANITIZE="$SANITIZE" VFHE_COVERAGE="$COVERAGE"
    # ------------------------------------------------------------- measure ---
    - name: Upload Python coverage
      if: inputs.coverage == 'true'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        directory: build/meson-logs
        disable_search: false
        fail_ci_if_error: false
        use_oidc: true
