name: Check workflow status
description: >
  Assert that a named workflow succeeded for this commit, so nothing ships from
  a push that went red. Reads a status already recorded and never waits for one.

inputs:
  presence:
    description: required fails when no run exists; optional accepts a workflow that legitimately skipped.
    default: required
  workflow:
    description: Display name of the workflow whose status is read.
    required: true

runs:
  using: composite
  steps:
    - name: Read the status recorded for this commit
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PRESENCE: ${{ inputs.presence }}
        REPOSITORY: ${{ github.repository }}
        SHA: ${{ github.sha }}
        WORKFLOW: ${{ inputs.workflow }}
      run: |
        gh api "repos/$REPOSITORY/actions/runs?head_sha=$SHA" \
          | "$GITHUB_ACTION_PATH/status.sh" "$SHA" "$WORKFLOW" "$PRESENCE" \
          | tee -a "$GITHUB_STEP_SUMMARY"
