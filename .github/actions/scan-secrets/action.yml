name: Scan secrets
description: >
  Scan the whole history for committed secrets. By hand rather than the official
  action, which needs a paid licence for organisation repositories; nothing
  bumps the pin, so it lives in .github/gitleaks.json.

runs:
  using: composite
  steps:
    # ------------------------------------------------------------- install ---
    - name: Download gitleaks
      shell: bash
      run: |
        version=$(jq -r .version .github/gitleaks.json)
        sha256=$(jq -r .sha256 .github/gitleaks.json)
        curl -sSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
        echo "$sha256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
    # ---------------------------------------------------------------- scan ---
    - name: Scan the history
      shell: bash
      run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner'
