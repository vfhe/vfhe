root = .
filter = modules/.*/c/src/
# Every engine compiles the same sources, so a line has one record per engine.
merge-mode-functions = merge-use-line-max
# A hot kernel runs billions of times in one test run, above the default 2^32
# ceiling gcovr treats as a parse error.
gcov-suspicious-hits-threshold = 0
